# PaletteVault - Technical Specification & Dependency Versions
# Versions researched 20 Oct 2026 (updated for Submission 3)

application:
  name: PaletteVault
  version: "1.0.0"
  environment: development
  entry_point: palettevault.py
  local_url: http://127.0.0.1:5000

database:
  name: PostgreSQL
  version: "18.6"
  server: localhost
  database: palettevault
  maintenance_database: postgres
  port: 5432
  username: postgres
  password: postgres
  prompt: "postgres=# "
  driver:
    name: psycopg2-binary
    version: "2.9.12"
  orm:
    name: SQLAlchemy
    version: "2.0.51"
  tables:
    - users
    - products
    - usage_logs
    - wishlist_items
  schema_file: database/create_tables.sql
  seed_data:
    - data/users.csv
    - data/products.csv
    - data/usage_logs.csv
    - data/wishlist_items.csv
  automation:
    - script: initialise_db.py
      purpose: Creates the palettevault database and tables
    - script: populate_db.py
      purpose: Loads the CSV seed data into the tables

backend:
  language:
    name: Python
    version: "3.14"
  framework:
    name: Flask
    version: "3.1.3"
  packages:
    - name: Flask
      version: "3.1.3"
      purpose: Web framework
    - name: Flask-Login
      version: "0.6.3"
      purpose: User session management
    - name: Werkzeug
      version: "3.1.5"
      purpose: Password hashing and WSGI toolkit
    - name: Flask-WTF
      version: "1.2.2"
      purpose: Forms and CSRF protection
    - name: WTForms
      version: "3.2.2"
      purpose: Form fields and validators
    - name: SQLAlchemy
      version: "2.0.51"
      purpose: ORM
    - name: psycopg2-binary
      version: "2.9.12"
      purpose: PostgreSQL driver
    - name: gunicorn
      version: "23.0.0"
      purpose: Production web server (used in Docker / Render)

frontend:
  - name: HTML
    version: "5"
  - name: CSS
    version: "3"
    file: app/static/css/style.css
  - name: Jinja2
    version: "3.1.6"
    purpose: Page templates

authentication:
  - name: Flask-Login
    version: "0.6.3"
    purpose: Login sessions
  - name: Werkzeug
    version: "3.1.5"
    purpose: Password hashing

quality_and_testing:
  - name: pytest
    version: "9.1.1"
    purpose: Unit testing
  - name: flake8
    version: "7.3.0"
    purpose: Code linting

containerisation_and_devops:
  - name: Docker Engine
    version: "29.7.2"
    purpose: Containers
  - name: GitHub Actions
    version: hosted service
    config_format: YAML
    purpose: CI/CD pipeline
  - name: PostgreSQL service container
    version: "18"
    purpose: Database for CI tests

deployment:
  platform: Render
  operating_system:
    name: Ubuntu
    version: "22.04 LTS"